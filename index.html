    .btn-selected{background:#fb923c;color:#fff;border-color:#f97316}
    .page-hidden{display:none}
    #petal-container{transition:min-height .3s ease}
    .petal-char-container,.center-char-container{transform:translateZ(0)}
    .zhuyin-col{display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1;margin-left:2px}
    
    /* 部首圈小點 */
    .radical-dot{
      position:absolute; display:flex; align-items:center; justify-content:center;
      width:2.25rem; height:2.25rem; border-radius:9999px;
      background:#f1f5f9; border:2px solid #cbd5e1; font-weight:600;
      transition:transform .15s ease, background .15s ease, border-color .15s ease;
      box-shadow:0 2px 6px rgba(0,0,0,.06);
    }
    .radical-dot:hover{ transform:scale(1.08); background:#fee2e2; border-color:#fecaca }
    
    /* 中心字下方的部首徽章 */
    .center-radical-badge{
      position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
      background:#fff; border:2px solid #fde68a; color:#b45309;
      padding:.1rem .4rem; border-radius:9999px; font-weight:700; font-size:.9rem;
      box-shadow:0 2px 6px rgba(0,0,0,.06);
    }

/* =========================================
       🖨️ 列印專用樣式 (絕對定位修正版)
       ========================================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      
      /* 1. 隱藏不相關元素 */
      #selection-page, footer, #back-button, #print-button, #search-area-wrapper {
        display: none !important;
      }

      /* 2. 基礎設定 */
      body, html {
        background-color: white !important;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .container {
        width: 100% !important;
        max-width: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /* 3. 結果頁全螢幕設定 */
      #results-page {
        display: block !important; /* 改回 block，方便絕對定位 */
        width: 100vw !important;
        height: 100vh !important;
        background: white !important;
        position: relative !important;
        overflow: hidden !important;
      }

      /* 移除 main 的干擾 */
      #results-page main {
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }

      /* 4. 標題設定：大字、置頂 */
      #results-page header {
        position: absolute;
        top: 2cm; 
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 20;
      }
      #results-page h1 {
        color: #000 !important;
        font-size: 3.5rem !important; /* 大標題 */
        font-weight: 900 !important;
        margin: 0 !important;
      }

      /* 5. 花瓣設定：絕對定位 + 放大 */
      #petal-container {
        position: absolute !important;
        left: 50% !important;
        /* top: 40% 代表花瓣中心點在紙張上面 40% 的位置
           如果覺得太近，改 45%；覺得太遠，改 35% */
        top: 45% !important; 
        
        /* 放大 1.8 倍 */
        transform: translate(-50%, -50%) scale(1.8) !important;
        
        transform-origin: center center !important;
        min-height: 0 !important; /* 避免高度干擾 */
        z-index: 10;
      }

      /* 6. 版權宣告 */
  /* 修改處：改用 fixed 定位，確保手機列印也能顯示 */
      #results-page::after {
        content: "© 2025 Christina Yu. All Rights Reserved."; 
        position: fixed;    /* 👈 從 absolute 改成 fixed */
        bottom: 0;          /* 👈 貼齊紙張底部 */
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 10pt;    /* 手機上字體稍微縮小一點點比較保險 */
        color: #666 !important;
        font-family: sans-serif;
        padding-bottom: 1cm; /* 👈 用 padding 來留白，避免字貼底邊太近 */
        background-color: white; /* 確保背景白底，蓋過可能存在的雜線 */
      }

      /* 7. 線框化與去背設定 (白底黑字) */
      .center-char-container, .petal-char-container {
        background-color: white !important;
        border: 2px solid #000 !important;
        box-shadow: none !important;
        color: #000 !important;
      }

      .center-char-container .zhuyin-col {
        color: #000 !important;
      }

      .radical-dot {
        background-color: white !important;
        border: 1px solid #000 !important;
        color: #000 !important;
        box-shadow: none !important;
      }

      .center-radical-badge, 
      .center-char-container div.absolute {
         background-color: white !important;
         border: 1px solid #000 !important;
         color: #000 !important;
      }

{

{

},
{

  characters: [

    { char: "園", zhuyin: "ㄩㄢˊ", radical: "囗" },
    { char: "猿", zhuyin: "ㄩㄢˊ", radical: "犬" },
    { char: "轅", zhuyin: "ㄩㄢˊ", radical: "車" }
  ]
},
{
  component: { char: "員", zhuyin: "ㄩㄢˊ", radical: "口" },
  characters: [
    { char: "圓", zhuyin: "ㄩㄢˊ", radical: "囗" },
    { char: "損", zhuyin: "ㄙㄨㄣˇ", radical: "手" },
    { char: "隕", zhuyin: "ㄩㄣˇ", radical: "阜" }
  ]
},
      {component:{char:"夗",zhuyin:"ㄩㄢˋ", radical:"夕"},characters:[
        {char:"苑",zhuyin:"ㄩㄢˋ", radical:"艸"},
        {char:"怨",zhuyin:"ㄩㄢˋ", radical:"心"},
        {char:"宛",zhuyin:"ㄨㄢˇ", radical:"宀"},
{ char: "鴛", zhuyin: "ㄩㄢ", radical: "鳥" }
      ]},
      {component:{char:"元",zhuyin:"ㄩㄢˊ", radical:"二"},characters:[
        {char:"玩",zhuyin:"ㄨㄢˊ", radical:"玉"},
        {char:"完",zhuyin:"ㄨㄢˊ", radical:"宀"},
        {char:"頑",zhuyin:"ㄨㄢˊ", radical:"頁"},
        {char:"皖",zhuyin:"ㄨㄢˇ", radical:"白"},
        {char:"烷",zhuyin:"ㄨㄢˊ", radical:"火"},
        {char:"冠",zhuyin:"ㄍㄨㄢ", radical:"冖"},
        {char:"莞",zhuyin:"ㄍㄨㄢˇ", radical:"艸"},
        {char:"浣",zhuyin:"ㄏㄨㄢˋ", radical:"水"}
      ]},
      {component:{char:"勻",zhuyin:"ㄩㄣˊ", radical:"勹"},characters:[
        {char:"筠",zhuyin:"ㄩㄣˊ", radical:"竹"},
        {char:"均",zhuyin:"ㄐㄩㄣ", radical:"土"},
        {char:"鈞",zhuyin:"ㄐㄩㄣ", radical:"金"},
        {char:"昀",zhuyin:"ㄩㄣˊ", radical:"日"}
      ]}
    ]
  };

  /* =========================
     ② 部首正字化（偏旁→正字）
     ========================= */
  const RAD_NORMALIZE = new Map(Object.entries({
    "亻":"人","衤":"衣","氵":"水","月":"肉","⺼":"肉","扌":"手","忄":"心","犭":"犬",
    "飠":"食","饣":"食","礻":"示","艹":"艸","艸":"艸","糹":"糸","纟":"糸",
    "钅":"金","釒":"金","讠":"言","辶":"辵","阝":"阜"
  }));
  function canonicalRad(rad){
    if(!rad) return "";
    return RAD_NORMALIZE.get(rad) || rad;
  }

  /* =========================
     ③ 全文檢索（點結果→進入該部件花瓣頁）
     ========================= */
  const searchInput   = document.getElementById('search-input');
  const searchButton  = document.getElementById('search-button');
  const searchResults = document.getElementById('search-results');

  function searchCharacters(query){
    const q = (query||'').trim();
    if(!q) return [];

    const out = [];
    for(const zy in componentData){
      (componentData[zy] || []).forEach(item => {
        const comp = item.component || {};
        const compChar = comp.char || "";
        const compZy   = comp.zhuyin || "";

        if(compChar.includes(q) || compZy.includes(q)){
          out.push({
            type:'component',
            char: compChar,
            zhuyin: compZy
          });
        }

        (item.characters || []).forEach(c => {
          const ch = c.char || "";
          const zy = c.zhuyin || "";
          if(ch.includes(q) || zy.includes(q)){
            out.push({
              type:'character',
              char: ch,
              zhuyin: zy,
              parent: compChar
            });
          }
        });
      });
    }
    return out;
  }

  function findComponentItemByChar(ch){
    if(!ch) return null;
    for(const zy in componentData){
      for(const it of (componentData[zy] || [])){
        if(it?.component?.char === ch) return it;
      }
    }
    return null;
  }

  function renderSearchResults(results){
    if(!searchResults) return;
    searchResults.innerHTML = '';

    if(!results.length){
      searchResults.innerHTML =
        '<p class="text-gray-500">抱歉，資料庫中暫時找不到這個字或部件。</p>';
      return;
    }

    const header = document.createElement('div');
    header.className = 'text-sm text-gray-600';
    header.textContent = `搜尋結果（${results.length} 筆）`;
    searchResults.appendChild(header);

    results.forEach(r => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className =
        'w-full text-left bg-white border rounded-lg p-3 shadow hover:bg-orange-50';

      const extra = (r.type === 'character')
        ? `所屬部件：<b>${r.parent}</b>`
        : `查看「<b>${r.char}</b>」的所有延伸字`;

      btn.innerHTML = `
        <span class="text-2xl font-bold mr-2">${r.char}</span>
        <span class="text-gray-600">${r.zhuyin || ''}</span>
        <span class="text-sm text-gray-500 ml-2">${extra}</span>
      `;

      btn.addEventListener('click', () => {
        const target = (r.type === 'character') ? r.parent : r.char;
        const item = findComponentItemByChar(target);
        if(item) handleComponentClick(item);
      });

      searchResults.appendChild(btn);
    });
  }

  if(searchButton && searchInput){
    searchButton.addEventListener('click', () =>
      renderSearchResults(searchCharacters(searchInput.value))
    );
    searchInput.addEventListener('keypress', e => {
      if(e.key === 'Enter'){
        renderSearchResults(searchCharacters(searchInput.value));
      }
    });
  }

  /* =========================
     ④ 注音 / 部件列表
     ========================= */
  const zhuyinSymbols = [
    "ㄅ","ㄆ","ㄇ","ㄈ","ㄉ","ㄊ","ㄋ","ㄌ",
    "ㄍ","ㄎ","ㄏ","ㄐ","ㄑ","ㄒ","ㄓ","ㄔ","ㄕ","ㄖ","ㄗ","ㄘ","ㄙ",
    "ㄧ","ㄨ","ㄩ",
    "ㄚ","ㄛ","ㄜ","ㄝ","ㄞ","ㄟ","ㄠ","ㄡ","ㄢ","ㄣ","ㄤ","ㄥ","ㄦ"
  ];

  const selectionPage        = document.getElementById('selection-page');
  const resultsPage          = document.getElementById('results-page');
  const zhuyinList           = document.getElementById('zhuyin-list');
  const componentList        = document.getElementById('component-list');
  const componentPlaceholder = document.getElementById('component-placeholder');
  const petalContainer       = document.getElementById('petal-container');
  const backButton           = document.getElementById('back-button');
  const printButton          = document.getElementById('print-button');

  let selectedZhuyinBtn = null;
  let currentItem = null;

  if(zhuyinList){
    zhuyinSymbols.forEach(symbol => {
      const btn = document.createElement('button');
      btn.textContent = symbol;
      btn.dataset.zhuyin = symbol;

      const has = (componentData[symbol] || []).length > 0;

      if(!has){
        btn.disabled = true;
        btn.className =
          "text-lg border-2 border-gray-200 bg-gray-100 text-gray-400 rounded-md w-10 h-10 flex items-center justify-center cursor-not-allowed opacity-50";
      }else{
        btn.className =
          "text-lg border-2 border-gray-300 rounded-md w-10 h-10 flex items-center justify-center cursor-pointer transition-colors hover:bg-orange-100";
        btn.addEventListener('click', handleZhuyinClick);
      }

      zhuyinList.appendChild(btn);
    });
  }

  function handleZhuyinClick(e){
    const zy = e.target.dataset.zhuyin;
    const items = componentData[zy] || [];

    if(selectedZhuyinBtn) selectedZhuyinBtn.classList.remove('btn-selected');
    selectedZhuyinBtn = e.target;
    selectedZhuyinBtn.classList.add('btn-selected');

    if(componentList) componentList.innerHTML = '';

    if(items.length){
      if(componentPlaceholder) componentPlaceholder.style.display = 'none';

      items.forEach(item => {
        const b = document.createElement('button');
        b.textContent = item?.component?.char || "";
        b.className =
          "text-2xl font-bold border-2 border-gray-300 rounded-lg w-16 h-16 flex items-center justify-center cursor-pointer transition-all hover:bg-orange-100 hover:border-orange-400";
        b.addEventListener('click', () => handleComponentClick(item));
        componentList?.appendChild(b);
      });

    }else{
      if(componentPlaceholder){
        componentPlaceholder.style.display = 'block';
        componentPlaceholder.textContent = '這個注音沒有對應的部件喔！';
      }
    }
  }

  function handleComponentClick(item){
    currentItem = item;

    selectionPage?.classList.add('page-hidden');
    resultsPage?.classList.remove('page-hidden');

    const h1 = resultsPage?.querySelector('h1');
    if(h1){
      const cc = item?.component?.char || "";
      h1.textContent = `「${cc}」的字族`;
    }

    renderPetalView(item);
  }

  backButton?.addEventListener('click', () => {
    resultsPage?.classList.add('page-hidden');
    selectionPage?.classList.remove('page-hidden');
  });

  if(printButton){
    printButton.addEventListener('click', () => window.print());
  }

  /* =========================
     ⑤ 螢幕佈局（半徑、尺寸）
     ========================= */
  function computeLayout(petalCount){
    const W = window.innerWidth;
    const isNarrow = W < 390;
    const isMobile = W < 640 && !isNarrow;

    let centerWH, centerText, size, centerRadius, dotRadius, petalRadius;
    const dotSizeNarrow = 32;
    const dotSizeDesktop = 36;

    if(isNarrow){
      centerWH = 'w-24 h-24'; centerText = 'text-4xl';
      centerRadius = 48;
      dotRadius = dotSizeNarrow / 2;

      if(petalCount <= 8){
        size = {container:'w-20 h-20', char:'text-4xl', zhuyin:'text-sm', tone:'text-sm'};
        petalRadius = 40;
      } else if(petalCount <= 12){
        size = {container:'w-[72px] h-[72px]', char:'text-3xl', zhuyin:'text-xs', tone:'text-xs'};
        petalRadius = 36;
      } else {
        size = {container:'w-16 h-16', char:'text-lg', zhuyin:'text-[10px]', tone:'text-[10px]'};
        petalRadius = 32;
      }

    } else if(isMobile){
      centerWH = 'w-24 h-24'; centerText = 'text-4xl';
      centerRadius = 48;
      dotRadius = dotSizeNarrow / 2;

      if(petalCount <= 8){
        size = {container:'w-20 h-20', char:'text-4xl', zhuyin:'text-sm', tone:'text-sm'};
        petalRadius = 40;
      } else if(petalCount <= 12){
        size = {container:'w-[76px] h-[76px]', char:'text-4xl', zhuyin:'text-sm', tone:'text-sm'};
        petalRadius = 38;
      } else {
        size = {container:'w-16 h-16', char:'text-3xl', zhuyin:'text-xs', tone:'text-xs'};
        petalRadius = 32;
      }

    } else {
      centerWH = 'w-28 h-28'; centerText = 'text-5xl';
      centerRadius = 56;
      dotRadius = dotSizeDesktop / 2;

      if(petalCount <= 8){
        size = {container:'w-24 h-24', char:'text-4xl', zhuyin:'text-sm', tone:'text-sm'};
        petalRadius = 48;
      } else if(petalCount <= 12){
        size = {container:'w-20 h-20', char:'text-4xl', zhuyin:'text-sm', tone:'text-sm'};
        petalRadius = 40;
      } else {
        size = {container:'w-16 h-16', char:'text-2xl', zhuyin:'text-xs', tone:'text-xs'};
        petalRadius = 32;
      }
    }

    const centerBorderWidth = 4;
    const R2 = centerRadius + centerBorderWidth + dotRadius;
    const R  = R2 + dotRadius + petalRadius;

    const totalDiameter = (R + petalRadius) * 2;
    const minH = totalDiameter + 40;

    return { isNarrow, isMobile, centerWH, centerText, R, size, R2, minH };
  }

  /* =========================
     ⑥ 花瓣 / 部首圈
     ========================= */
  function createZhuyinHTML(zhuyinString, sizeClass, charClass){
    const tones = ['ˊ','ˇ','ˋ','˙'];
    const last = zhuyinString ? zhuyinString.slice(-1) : '';
    let base = '', tone = '';

    if(tones.includes(last)){
      base = zhuyinString.slice(0, -1);
      tone = last;
    } else {
      base = zhuyinString || '';
      tone = '';
    }

    return base.split('').map((ch, i) => {
      if(i === base.length - 1 && tone){
        return `<span class="relative ${charClass}">${ch}<span class="absolute -top-1 -right-3 ${sizeClass}">${tone}</span></span>`;
      }
      return `<span class="${charClass}">${ch}</span>`;
    }).join('');
  }

  function createPetalElement(charObj, size){
    const link = document.createElement('a');
    link.href = `https://dict.concised.moe.edu.tw/search.jsp?word=${encodeURIComponent(charObj.char)}`;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';

    const wrap = document.createElement('div');
    wrap.className =
      `absolute flex items-center justify-center bg-pink-200 border-2 border-pink-300 rounded-full ${size.container} transition-transform hover:scale-110 hover:bg-pink-300 shadow petal-char-container`;

    const big = document.createElement('span');
    big.className = `${size.char} font-medium`;
    big.textContent = charObj.char;

    const zy = document.createElement('div');
    zy.className = 'zhuyin-col text-gray-600';
    zy.innerHTML = createZhuyinHTML(charObj.zhuyin || '', size.tone, size.zhuyin);

    wrap.appendChild(big);
    wrap.appendChild(zy);

    link.appendChild(wrap);

    return { link, container: wrap };
  }

  function createRadicalDot(label, isNarrow, isMobile){
    const txt = canonicalRad(label);
    const el = document.createElement('div');

    const cls = isNarrow
      ? 'w-8 h-8 text-sm'
      : (isMobile ? 'w-8 h-8 text-sm' : 'w-9 h-9 text-base');

    el.className =
      `radical-dot absolute bg-emerald-100 border border-emerald-300 rounded-full ${cls} flex items-center justify-center text-emerald-700 shadow font-normal`;

    el.textContent = txt || '';
    el.style.pointerEvents = 'none';

    return el;
  }

  function renderPetalView(item){
    if(!petalContainer) return;

    petalContainer.innerHTML = '';

    const characters = item?.characters || [];
    const n = characters.length;
    const L = computeLayout(n);

    // 中心
    const compChar = item?.component?.char || "";
    const compZy   = item?.component?.zhuyin || "";
    const compRad  = item?.component?.radical || "";

    const centerLink = document.createElement('a');
    centerLink.href = `https://dict.concised.moe.edu.tw/search.jsp?word=${encodeURIComponent(compChar)}`;
    centerLink.target = '_blank';
    centerLink.rel = 'noopener noreferrer';

    const centerDiv = document.createElement('div');
    centerDiv.className =
      `center-char-container absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-yellow-200 border-4 border-yellow-300 rounded-full ${L.centerWH} flex items-center justify-center z-20 transition-transform hover:scale-110 shadow-lg`;

    const centerChar = document.createElement('span');
    centerChar.className = `${L.centerText} font-bold`;
    centerChar.textContent = compChar;

    const centerZh = document.createElement('div');
    centerZh.className = "zhuyin-col text-gray-700 font-medium";
    centerZh.innerHTML = createZhuyinHTML(compZy, 'text-sm', 'text-sm');

    centerDiv.appendChild(centerChar);
    centerDiv.appendChild(centerZh);

    // 中心部首膠囊
    if(compRad){
      const pill = document.createElement('div');
      pill.className =
        'absolute -bottom-1 left-1/2 -translate-x-1/2 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-full px-2 py-[2px] text-sm';
      pill.textContent = canonicalRad(compRad);
      centerDiv.appendChild(pill);
    }

    centerLink.appendChild(centerDiv);
    petalContainer.appendChild(centerLink);

    petalContainer.style.minHeight = L.minH + 'px';

    // 外圈花瓣
    const step = (2 * Math.PI) / Math.max(n, 1);

    characters.forEach((c, i) => {
      const a = i * step - Math.PI / 2;
      const x = Math.cos(a) * L.R;
      const y = Math.sin(a) * L.R;

      const { link, container } = createPetalElement(c, L.size);
      container.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
      container.style.top = '50%';
      container.style.left = '50%';

      petalContainer.appendChild(link);

      // 部首圈
      if(c.radical){
        const rx = Math.cos(a) * L.R2;
        const ry = Math.sin(a) * L.R2;
        const dot = createRadicalDot(c.radical, L.isNarrow, L.isMobile);
        dot.style.left = '50%';
        dot.style.top  = '50%';
        dot.style.transform = `translate(-50%,-50%) translate(${rx}px,${ry}px)`;
        petalContainer.appendChild(dot);
      }
    });
  }

  // resize 重排
  window.addEventListener('resize', () => {
    if(resultsPage && !resultsPage.classList.contains('page-hidden') && currentItem){
      renderPetalView(currentItem);
    }
  });

});
